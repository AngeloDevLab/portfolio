name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'n8n/**'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Upload the build to the server
        run: >
          rsync -az --delete --delay-updates -e "ssh -i ~/.ssh/deploy_key"
          dist/
          ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/portfolio/
